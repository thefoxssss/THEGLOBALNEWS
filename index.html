<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch AI Bridge</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #status {
            margin-top: 20px;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>Watch AI Bridge</h2>
    <button id="connectBtn">Connect to Wearable</button>
    <p id="status">Status: Disconnected</p>

    <script>
        document.getElementById('connectBtn').addEventListener('click', async () => {
            const statusText = document.getElementById('status');
            
            try {
                statusText.innerText = 'Scanning for watch...';
                
                // This triggers the native Android Bluetooth pop-up
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'AI_Watch_BLE' }], 
                    // optionalServices: ['your_custom_service_uuid'] // You'll uncomment this later
                });

                statusText.innerText = 'Connecting...';
                
                // Connect to the GATT server on the ESP32
                const server = await device.gatt.connect();
                
                statusText.innerText = 'Connected to: ' + device.name;
                statusText.style.color = 'green';

                // From here, you can read and write data to the watch!

            } catch (error) {
                console.error(error);
                statusText.innerText = 'Error: ' + error.message;
                statusText.style.color = 'red';
            }
        });
    </script>
</body>
</html>
